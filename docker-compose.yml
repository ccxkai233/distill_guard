# 网关 + Redis 一把起。
#   docker compose up -d          # 默认影子模式, 只记日志
#   docker compose logs -f gateway
# 开处置: 把 DG_SHADOW 改成 "0" 后 docker compose up -d
services:
  gateway:
    build: .
    ports:
      # 默认只绑本机, 网关前面没有鉴权/TLS, 不要直接暴露到公网。
      # 要对外提供服务, 改成 "8080:8080" 并在前面加反代 + 鉴权。
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    environment:
      DG_UPSTREAM: https://api.anthropic.com
      DG_SHADOW: "1"                    # "0" 开处置
      DG_REDIS_URL: redis://redis:6379
      DG_FREE_PER_MIN: "6"
      DG_FREE_PER_10S: "3"
      DG_MIN_PASS_RATE: "0.03"
      DG_SUSP_HALF_LIFE: "600"
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  redis-data:
